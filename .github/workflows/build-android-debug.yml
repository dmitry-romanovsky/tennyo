name: Build Android Debug

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub prerelease with the debug build"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  android-debug:
    name: Build Android debug APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          rm -rf .gradle
          rm -rf .intellijPlatform
          rm -rf .kotlin
          rm -rf build
          rm -rf app/shared/build
          rm -rf app/android/build
          rm -rf host/intellij/build
          rm -rf host/engine/build
          rm -rf host/vscode/build
          rm -rf app/ios/build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      # Chaquopy installs the app's bundled Python packages with a build-machine Python of the same version.
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Report Android debug version
        run: |
          android_base_version_name="$(sed -n 's/^tennyoVersionName=\(.*\)/\1/p' gradle.properties | head -n 1)"
          android_version_name_suffix="$(sed -n 's/^[[:space:]]*versionNameSuffix = "\(.*\)"/\1/p' app/android/build.gradle.kts | head -n 1)"
          android_version_code="$(sed -n 's/^tennyoVersionCode=\([0-9][0-9]*\)/\1/p' gradle.properties | head -n 1)"

          test -n "$android_base_version_name"
          test -n "$android_version_name_suffix"
          test -n "$android_version_code"

          android_version_name="$android_base_version_name$android_version_name_suffix"

          printf 'ANDROID_VERSION_NAME=%s\n' "$android_version_name" >> "$GITHUB_ENV"
          printf 'ANDROID_VERSION_CODE=%s\n' "$android_version_code" >> "$GITHUB_ENV"

          echo "::notice title=Android debug::versionName=$android_version_name appCode=$android_version_code"
          {
            echo "### Android debug"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version name | $android_version_name |"
            echo "| App code (versionCode) | $android_version_code |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android debug
        run: ./gradlew :app:shared:testAndroidHostTest :app:android:assembleDebug :app:android:bundleDebug

      - name: Prepare named Android debug files
        run: |
          mkdir -p release-assets
          apk_files=(app/android/build/outputs/apk/debug/*.apk)
          aab_files=(app/android/build/outputs/bundle/debug/*.aab)
          test "${#apk_files[@]}" -eq 1
          test "${#aab_files[@]}" -eq 1
          cp "${apk_files[0]}" "release-assets/tennyo-android-v${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}-debug.apk"
          cp "${aab_files[0]}" "release-assets/tennyo-android-v${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}-debug.aab"

      - name: Upload Android debug builds
        uses: actions/upload-artifact@v4
        with:
          name: tennyo-android-v${{ env.ANDROID_VERSION_NAME }}-${{ env.ANDROID_VERSION_CODE }}-debug
          path: release-assets/
          if-no-files-found: error

      - name: Create Android debug GitHub prerelease
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${ANDROID_VERSION_NAME}-debug"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Tennyo Android v${ANDROID_VERSION_NAME} (debug)" \
              --generate-notes \
              --prerelease
          fi

      - name: Upload Android debug test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-test-reports
          path: app/shared/build/reports/tests/
          if-no-files-found: ignore
