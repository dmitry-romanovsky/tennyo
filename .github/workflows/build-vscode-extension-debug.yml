name: Build VS Code Extension Debug

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub prerelease with the debug VSIX"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  vscode-extension-debug:
    name: Build VS Code extension debug VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          rm -rf .gradle
          rm -rf .intellijPlatform
          rm -rf .kotlin
          rm -rf build
          rm -rf app/shared/build
          rm -rf host/intellij/build
          rm -rf host/engine/build
          rm -rf host/vscode/build
          rm -rf app/ios/build
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Report VS Code extension debug version
        run: |
          extension_version="$(sed -n 's/^pluginVersion=//p' gradle.properties | head -n 1)"
          test -n "$extension_version"

          printf 'VSCODE_EXTENSION_VERSION=%s\n' "$extension_version" >> "$GITHUB_ENV"

          echo "::notice title=VS Code extension debug::version=$extension_version"
          {
            echo "### VS Code extension debug"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | $extension_version |"
            echo "| Variant | debug |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build VS Code extension debug VSIX
        run: ./gradlew :host:engine:allTests :host:vscode:packageDebugVsix

      - name: Upload VS Code extension debug VSIX
        uses: actions/upload-artifact@v7
        with:
          name: tennyo-host-vscode-v${{ env.VSCODE_EXTENSION_VERSION }}-debug
          path: host/vscode/build/vsix/tennyo-host-*-debug.vsix
          if-no-files-found: error

      - name: Create VS Code extension debug GitHub prerelease
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix_files=(host/vscode/build/vsix/tennyo-host-*-debug.vsix)
          test "${#vsix_files[@]}" -eq 1
          tag="vscode-extension-v${VSCODE_EXTENSION_VERSION}-debug"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${vsix_files[0]}" --clobber
          else
            gh release create "$tag" "${vsix_files[0]}" \
              --target "$GITHUB_SHA" \
              --title "Tennyo Companion for VS Code v${VSCODE_EXTENSION_VERSION} (debug)" \
              --generate-notes \
              --prerelease
          fi

      - name: Upload VS Code extension debug test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension-debug-test-reports
          path: |
            host/engine/build/reports/tests/
            build/reports/problems/
          if-no-files-found: ignore
